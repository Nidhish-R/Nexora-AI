<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>ZYRO AI - Login</title>


    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            font-family: Arial;

            background: #070711;

            color: white;

        }


        .box {

            width: 400px;

            max-width: 90%;

            padding: 35px;

            border-radius: 20px;

            background: #10101d;

            border: 1px solid #30305c;

        }


        h1 {

            text-align: center;

            margin-bottom: 5px;

        }


        p {

            text-align: center;

            color: #9999b0;

        }


        label {

            display: block;

            margin:
                18px 0 7px;

        }


        input {

            width: 100%;

            padding: 13px;

            border-radius: 9px;

            border: 1px solid #30305c;

            background: #070711;

            color: white;

            outline: none;

        }


        button {

            width: 100%;

            margin-top: 22px;

            padding: 13px;

            border: 0;

            border-radius: 9px;

            background: #6155ff;

            color: white;

            font-weight: bold;

            cursor: pointer;

        }


        .error {

            padding: 10px;

            margin-top: 15px;

            border-radius: 8px;

            background: #39202b;

            color: #ff9aaa;

        }


        a {

            color: #8178ff;

        }

    </style>

</head>


<body>


<div class="box">

    <h1>
        🤖Nexora AI
    </h1>


    <p>
        Welcome back bro! 🔥
    </p>


    {% if error %}

        <div class="error">
            {{ error }}
        </div>

    {% endif %}


    <form
        method="POST"
        action="/login">


        <label>
            Email
        </label>


        <input
            type="email"
            name="email"
            required>


        <label>
            Password
        </label>


        <input
            type="password"
            name="password"
            required>


        <button type="submit">

            LOGIN 🚀

        </button>


    </form>


    <p>

        Don't have an account?

        <a href="/signup">
            Create Account
        </a>

    </p>


</div>


</body>

</html>
